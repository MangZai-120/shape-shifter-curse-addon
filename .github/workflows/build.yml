# 附属构建 | Build SSCA Addon
# 推送/PR 时自动构建，也可在 Actions 页面手动触发。
# 注意：附属 build.gradle 硬依赖原版 SSC 的 jar（../幻型者诅咒原版_official/build/libs/...），
# 而原版目录不在附属仓库内，因此 CI 需先 clone 并构建原版作为依赖。

name: 构建 | Build Addon

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 防止 Gradle 卡住（网络拉依赖超时、remap 卡死等）烧光 Actions 配额
    timeout-minutes: 30

    steps:
      - name: 检出附属代码
        uses: actions/checkout@v4

      - name: 读取附属版本配置
        id: addon_props
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'mod_version archives_base_name ssc_version'

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 优化①：Gradle 依赖缓存前置到原版构建之前（原本在原版构建之后才初始化，导致原版每次零缓存全量
      # 下载依赖 + 重新 remap Minecraft）。前置后原版与附属构建共用 ~/.gradle 缓存，第二次起大幅提速。
      - name: 初始化 Gradle（依赖缓存）
        uses: gradle/actions/setup-gradle@v4

      # 优化②：缓存原版 SSC jar；ssc_version 没变就直接复用上次构建的原版 jar，跳过整个原版构建
      #（构建慢那次里最大的一块）。只有改了 gradle.properties 的 ssc_version 才会重新构建原版。
      - name: 缓存原版 SSC jar
        id: cache-ssc-jar
        uses: actions/cache@v4
        with:
          path: ../幻型者诅咒原版_official/build/libs
          key: ssc-jar-${{ steps.addon_props.outputs.ssc_version }}

      # 关键：附属依赖原版 jar；仅当上面的原版 jar 缓存未命中时，才 clone 并构建原版 SSC。
      - name: 检出并构建原版 SSC（附属依赖）
        if: steps.cache-ssc-jar.outputs.cache-hit != 'true'
        run: |
          echo "::group::Clone 原版 SSC"
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/onixary/shape-shifter-curse-fabric.git 幻型者诅咒原版_official
          cd 幻型者诅咒原版_official
          chmod +x ./gradlew
          echo "::endgroup::"

          echo "::group::Build 原版 SSC"
          ./gradlew build
          echo "::endgroup::"

          echo "::group::原版产物列表"
          ls -la build/libs/
          echo "::endgroup::"

      - name: 赋予附属 gradlew 可执行权限
        run: chmod +x ./gradlew

      - name: 构建附属
        run: ./gradlew build

      - name: 列出附属构建产物
        run: ls -la build/libs/

      # 整理构建产物：附属 jar 与原版 SSC jar 分别放进各自目录，上传为两个独立的 artifact（两个独立下载入口）
      - name: 整理构建产物（附属 / 原版 SSC 分开）
        run: |
          mkdir -p artifacts/ssca artifacts/ssc

          echo "::group::附属 jar"
          find build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} artifacts/ssca/ \;
          echo "附属产物："
          ls -la artifacts/ssca/
          echo "::endgroup::"

          echo "::group::原版 SSC jar（从父级原版目录取）"
          SSC_DIR="../幻型者诅咒原版_official/build/libs"
          if [ ! -d "$SSC_DIR" ]; then
            echo "::error::原版 SSC 构建目录不存在: $SSC_DIR"
            exit 1
          fi
          find "$SSC_DIR" -name '*.jar' ! -name '*-sources.jar' -exec cp {} artifacts/ssc/ \;
          echo "原版产物："
          ls -la artifacts/ssc/
          echo "::endgroup::"

      # 上传为两个独立的 artifact：SSCA 与 SSC 各自一个下载入口
      - name: 上传附属 SSCA 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.addon_props.outputs.archives_base_name }}-${{ steps.addon_props.outputs.mod_version }}
          path: artifacts/ssca/*.jar
          if-no-files-found: error
          # 模组 jar 不需要长期保留，14 天足够测试与回溯
          retention-days: 14

      - name: 上传原版 SSC 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: shape-shifter-curse-fabric-${{ steps.addon_props.outputs.ssc_version }}
          path: artifacts/ssc/*.jar
          if-no-files-found: error
          retention-days: 14
