name: 构建 | Build Addon

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SSC_REPOSITORY: https://github.com/onixary/shape-shifter-curse-fabric.git
  SSC_DIRECTORY: .ssc-upstream

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出附属代码
        uses: actions/checkout@v4

      - name: 读取附属版本配置
        id: addon_props
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'mod_version archives_base_name'

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 检查构建辅助工具
        run: python -m unittest discover -s .github/ci -p 'test_*.py' -v

      - name: 初始化 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 解析官方 SSC 默认分支当前提交
        id: ssc
        run: python .github/ci/upstream_ssc.py resolve --repository "$SSC_REPOSITORY" --github-output "$GITHUB_OUTPUT"

      - name: 缓存 SSC 当前提交产物
        uses: actions/cache@v4
        with:
          path: .ssc-upstream/build/libs
          key: ssc-${{ runner.os }}-snapshot-v2-${{ steps.ssc.outputs.commit }}

      - name: 校验缓存的提交与 JAR
        id: cached_ssc
        env:
          SSC_COMMIT: ${{ steps.ssc.outputs.commit }}
        run: python .github/ci/upstream_ssc.py verify --directory "$SSC_DIRECTORY/build/libs" --commit "$SSC_COMMIT" --allow-missing --github-output "$GITHUB_OUTPUT"

      - name: 构建当前 SSC 快照
        if: steps.cached_ssc.outputs.valid != 'true'
        env:
          SSC_COMMIT: ${{ steps.ssc.outputs.commit }}
        run: |
          git init "$SSC_DIRECTORY"
          git -C "$SSC_DIRECTORY" remote add origin "$SSC_REPOSITORY"
          git -C "$SSC_DIRECTORY" fetch --depth 1 origin "$SSC_COMMIT"
          git -C "$SSC_DIRECTORY" checkout --detach FETCH_HEAD
          test "$(git -C "$SSC_DIRECTORY" rev-parse HEAD)" = "$SSC_COMMIT"
          chmod +x "$SSC_DIRECTORY/gradlew"
          "$SSC_DIRECTORY/gradlew" --project-dir "$SSC_DIRECTORY" --console=plain clean build
          python .github/ci/upstream_ssc.py record --directory "$SSC_DIRECTORY/build/libs" --commit "$SSC_COMMIT" --repository "$SSC_REPOSITORY"

      - name: 确认附属将使用的 SSC 产物
        id: ssc_jar
        env:
          SSC_COMMIT: ${{ steps.ssc.outputs.commit }}
        run: python .github/ci/upstream_ssc.py verify --directory "$SSC_DIRECTORY/build/libs" --commit "$SSC_COMMIT" --github-output "$GITHUB_OUTPUT"

      - name: 构建与检查 SSCA
        env:
          SSC_JAR_PATH: ${{ steps.ssc_jar.outputs.jar_path }}
        run: |
          chmod +x ./gradlew
          ./gradlew --console=plain build "-Pssc_jar_path=$SSC_JAR_PATH"

      - name: 整理分别下载的产物与构建记录
        env:
          SSC_JAR_PATH: ${{ steps.ssc_jar.outputs.jar_path }}
        run: |
          mkdir -p artifacts/ssca artifacts/ssc
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} artifacts/ssca/ \;
          cp "$SSC_JAR_PATH" artifacts/ssc/
          cp "$SSC_DIRECTORY/build/libs/ssc-build.json" artifacts/ssc/
          cp "$SSC_DIRECTORY/build/libs/ssc-build.json" artifacts/ssca/ssc-dependency.json
          sha256sum artifacts/ssca/*.jar artifacts/ssc/*.jar > artifacts/checksums.txt
          cp artifacts/checksums.txt artifacts/ssca/
          cp artifacts/checksums.txt artifacts/ssc/
          cat artifacts/checksums.txt >> "$GITHUB_STEP_SUMMARY"

      - name: 上传附属 SSCA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.addon_props.outputs.archives_base_name }}-${{ steps.addon_props.outputs.mod_version }}
          path: artifacts/ssca/*
          if-no-files-found: error
          retention-days: 14

      - name: 上传对应的 SSC 快照
        uses: actions/upload-artifact@v4
        with:
          name: shape-shifter-curse-fabric-${{ steps.ssc_jar.outputs.version }}-${{ steps.ssc.outputs.commit }}
          path: artifacts/ssc/*
          if-no-files-found: error
          retention-days: 14
