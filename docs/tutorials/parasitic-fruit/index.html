<body>
  <main id="panel" class="skin-window" aria-label="形态教程">

        <video id="video" playsinline controls preload="metadata" controlslist="nofullscreen noremoteplayback nodownload" disablepictureinpicture aria-label="技能实机演示"></video>

    <button id="back" class="mc-button" type="button" hidden>返回教程</button>
