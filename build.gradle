plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    mixin {
        defaultRefmapName = "ssc-addon.refmap.json"
    }
}

repositories {
    mavenLocal()
    // Aliyun
    maven { url 'https://maven.aliyun.com/nexus/content/groups/public' }
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }

    // GeckoLib（主包 PR #488 已从 AzureLib 迁移到 GeckoLib，附属随之对齐）
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }

    // KosmX (Player Animator)
    maven {
        name "KosmX's maven"
        url 'https://maven.kosmx.dev/'
    }

    // Owo
    maven { url 'https://maven.wispforest.io/releases/' }

    // Modrinth
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    // Forgemaven
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }

    // Others
    maven { url "https://maven.quiltmc.org/repository/release" }
    maven { url "https://maven.ladysnake.org/releases" }
    maven {
        url = "https://maven.cafeteria.dev"
        content { includeGroup "net.adriantodt.fabricmc" }
    }
    maven {
        url = "https://maven.jamieswhiteshirt.com/libs-release"
        content { includeGroup "com.jamieswhiteshirt" }
    }
    maven { url "https://masa.dy.fi/maven" }
    maven { url "https://jitpack.io" }
    maven { url "https://maven.shedaniel.me" }
    maven { url "https://maven.terraformersmc.com" }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Mixin Annotation Processor
    annotationProcessor "net.fabricmc:fabric-mixin-compile-extensions:0.6.0"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Shape Shifter Curse Main Mod（原版源码目录：幻型者诅咒原版_official，onixary 官方 clone 干净版）
    modImplementation files("../幻型者诅咒原版_official/build/libs/shape-shifter-curse-fabric-${project.ssc_version}.jar")
    
    // Team Reborn Energy API（TechReborn 等工业模组通用能量 API；3.0.0 适用 MC 1.19.4~1.20.4）
    // JiJ 打包进附属 jar：未安装任何工业模组时也能安全加载，能量转变器仅在检测到相邻能量方块时工作
    include modApi("teamreborn:energy:${project.tb_energy_version}")
    
    // Player Animator
    modImplementation "dev.kosmx.player-anim:player-animation-lib-fabric:${project.player_anim}"

    // Apoli & Dependencies
    modImplementation "com.github.apace100:apoli:${project.apoli_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"
    modImplementation "dev.emi:trinkets:${project.trinkets_version}"

    // Pehkui（碰撞箱缩放，原版 SSC 已依赖；附属用于幽雾化形碰撞箱缩放，替代 mixin）
    modApi("com.github.Virtuoel:Pehkui:${project.pehkui_version}", {
        exclude group: "net.fabricmc.fabric-api"
    })
    modImplementation ("com.terraformersmc:modmenu:${project.modmenu_version}"){transitive = false}
    modImplementation "com.jamieswhiteshirt:reach-entity-attributes:${project.reach_version}"
    
    // Irons Spellbooks (Forge) - Using compileOnly for API access
    modCompileOnly "curse.maven:irons-spells-n-spellbooks-855414:7552907" // Fr 1.20.1-3.15.2

    // REI 配方查看器（可选依赖：编译期用 API，运行时未装不崩）
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:12.1.785"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:12.1.785"
    // JEI 配方查看器（可选依赖）
    modCompileOnly "curse.maven:jei-238222:8622779" // Fr 1.20.1 JEI（与主包同源同版本）
    // EMI 配方查看器（可选依赖；本地 libs 手动引入——terraformersmc maven 重定向的 sleeping.town 网络不可达）
    modCompileOnly files("libs/emi-fabric-1.1.0+1.20.1.jar")
    
    // Config & Components (Usually needed by Apoli/Origins)
    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modApi("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${cca_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modApi("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${cca_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // Calio (included in Apoli, but good to ensure availability)
    // implementation "io.github.apace100:calio:${project.calio_version}" 
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.compilerArgs << '-Xlint:deprecation'
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}




